# 검증 위임 체계의 기계 판정 단계 (ADR-0009)
# PR과 main 푸시마다 백엔드(빌드·테스트·격리 검사·뮤테이션), 웹 클라이언트(타입·lint·테스트·빌드),
# 플랫폼 간 암호 테스트 벡터, 문서 검사를 돌린다
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR 브랜치에 새로 푸시하면 이전 실행은 취소한다. main 커밋은 하나하나 결과를 남기도록 취소하지 않는다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Gradle을 한 번만 띄우도록 검증과 뮤테이션 테스트를 한 호출로 돌린다
      - name: 빌드·테스트·격리 검사·뮤테이션 테스트
        run: ./gradlew check :domain:pitest --console=plain

      - name: 뮤테이션 점수 요약
        if: always()
        run: |
          if [ -f domain/build/reports/pitest/mutations.xml ]; then
            python3 ../Scripts/mutation-score.py domain/build/reports/pitest/mutations.xml >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            Back/*/build/reports/tests
            Back/domain/build/reports/pitest
          if-no-files-found: ignore

  # 웹·데스크톱 클라이언트 (ADR-0010, ADR-0012)
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/Web/package-lock.json

      - run: npm ci

      - name: 타입 검사·lint(계층 격리 포함)·테스트
        run: npm run check

      # 타입 검사는 위 check에서 했으므로 번들만 만든다
      - name: 빌드
        run: npx vite build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 문서 검사
        run: bash Scripts/check-docs.sh

  # 플랫폼 간 암호 테스트 벡터: 백엔드 결과와 상관없이 항상 돌도록 따로 둔다
  crypto-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 생성기 재계산 (WebCrypto)
        run: node Tools/crypto-vectors/vectors.mjs --check

      - name: Python 교차 검증
        run: python3 Tools/crypto-vectors/crosscheck.py

      - name: JDK 교차 검증 (AES-GCM 포함)
        run: java Tools/crypto-vectors/CrossCheck.java
