# 검증 위임 체계의 기계 판정 단계 (ADR-0009)
# PR과 main 푸시마다 백엔드(빌드·테스트·격리 검사·뮤테이션), Android(테스트·lint·빌드), 웹 클라이언트(타입·lint·테스트·빌드),
# 플랫폼 간 암호 테스트 벡터, 문서 검사를 돌린다
# 웹은 공유 Kotlin 세션(Apps/Shared/web-session) 빌드 결과를 쓰므로, 웹을 다루는 job은 먼저 .github/actions/build-web-session으로 만든다
# 그 action은 공개 저장소 carti1108/carti-RIBs-KMP를 고정한 커밋으로 받는다. 토큰은 필요 없다
name: CI

on:
  pull_request:
  # main에 올리기 전인 브랜치를 PR 없이 돌려 볼 때 쓴다 (gh workflow run ci.yml --ref <브랜치>)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# PR 브랜치에 새로 푸시하면 이전 실행은 취소한다. main 커밋은 하나하나 결과를 남기도록 취소하지 않는다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR에서 바뀐 경로를 보고 플랫폼 잡을 고른다. main 푸시와 워크플로 변경은 전부 돌린다
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.pick.outputs.backend }}
      android: ${{ steps.pick.outputs.android }}
      web: ${{ steps.pick.outputs.web }}
      apple: ${{ steps.pick.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            files="__all__"
          else
            files=$(git diff --name-only "$BASE"...HEAD)
          fi
          echo "$files"
          hit() {
            [ "$files" = "__all__" ] && return 0
            echo "$files" | grep -Eq "^(\.github/workflows/|$1)"
          }
          out() { if hit "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          out backend 'Back/'
          # Android와 웹은 화면 로직·도메인을 공유 Kotlin(Apps/Shared)에서 가져온다
          out android 'Apps/Android/|Apps/Shared/|Tools/design-tokens/'
          out web 'Apps/Web/|Apps/Shared/|Tools/design-tokens/'
          # Apple 앱도 화면 로직·도메인·플랫폼 구현을 공유 Kotlin(Apps/Shared)에서 가져온다 (modularization-plan F단계)
          out apple 'Apps/Apple/|Apps/Shared/|Tools/design-tokens/|Scripts/(verify-apple|check-apple-lint|check-swift-architecture)\.sh'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Gradle을 한 번만 띄우도록 검증과 뮤테이션 테스트를 한 호출로 돌린다
      - name: 빌드·테스트·격리 검사·뮤테이션 테스트
        run: ./gradlew check :domain:pitest --console=plain

      - name: 뮤테이션 점수 요약
        if: always()
        run: |
          if [ -f domain/build/reports/pitest/mutations.xml ]; then
            python3 ../Scripts/mutation-score.py domain/build/reports/pitest/mutations.xml >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            Back/*/build/reports/tests
            Back/domain/build/reports/pitest
          if-no-files-found: ignore

  # Android 클라이언트. 뷰와 진입점만 있고 도메인·RIB은 공유 Kotlin(Apps/Shared)을 composite build로 가져온다 (android-migration-plan).
  # 러너에 설치된 Android SDK를 쓰고, 없는 SDK 플랫폼은 AGP가 받는다
  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Apps/Shared가 공유 RIB 라이브러리(carti-RIBs-KMP)를 composite build로 가져온다. 워크스페이스 안에 받고 CARTI_RIBS_DIR로 알려 준다
      - uses: actions/checkout@v4
        with:
          repository: carti1108/carti-RIBs-KMP
          # 버전 고정: 검증한 커밋만 받는다. 라이브러리를 올릴 때 두 곳(ci.yml, build-web-session/action.yml)을 함께 바꾼다
          ref: b2b652c790c9d9d70be8baed293b1c2b3bc175f8
          path: carti-RIBs-KMP

      - name: 공유 Kotlin 모듈 테스트 (도메인·RIB)
        working-directory: Apps/Shared
        env:
          CARTI_RIBS_DIR: ${{ github.workspace }}/carti-RIBs-KMP
        run: ./gradlew jvmTest --console=plain

      - name: 단위 테스트·lint·디버그 빌드
        env:
          CARTI_RIBS_DIR: ${{ github.workspace }}/carti-RIBs-KMP
        run: ./gradlew test lint assembleDebug --console=plain

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            Apps/Android/**/build/reports/tests
            Apps/Shared/**/build/reports/tests
            Apps/Android/**/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # 웹·데스크톱 클라이언트 (ADR-0010, ADR-0012)
  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/Web
    steps:
      - uses: actions/checkout@v4

      # 타입 검사·번들이 읽는 Kotlin 세션 빌드 결과(keymanage-web-session)를 먼저 만든다
      - uses: ./.github/actions/build-web-session

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/Web/package-lock.json

      - run: npm ci

      - name: 타입 검사·lint(계층 격리 포함)·테스트
        run: npm run check

      # 타입 검사는 위 check에서 했으므로 번들만 만든다
      - name: 빌드
        run: npx vite build

  # 웹 클라이언트 코드를 실제 백엔드에 붙여 가입·동기화·충돌 병합·잠금 흐름을 확인한다
  integration:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21·Gradle 준비와 Kotlin 세션 빌드. 통합 테스트도 이 결과로 앱을 만들고, 아래 백엔드 빌드가 같은 JDK·Gradle을 쓴다
      - uses: ./.github/actions/build-web-session

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/Web/package-lock.json

      - name: 백엔드 실행
        working-directory: Back
        run: |
          ./gradlew :app:bootJar --console=plain
          # -plain.jar은 의존성이 없는 jar라 실행 가능한 jar만 고른다
          java -jar "$(ls app/build/libs/*.jar | grep -v plain)" > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: 백엔드 준비 대기
        run: |
          for i in $(seq 1 60); do
            # 시작하다 죽었으면 2분을 다 기다리지 않고 바로 실패한다
            kill -0 "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || exit 1
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"email":"probe@example.com"}' http://localhost:8080/api/v1/auth/prelogin || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          exit 1

      - name: 통합 테스트
        working-directory: Apps/Web
        run: |
          npm ci
          npm run test:integration

      - name: 실패 시 백엔드 로그
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  # 데스크톱 틀(Tauri v2)이 컴파일되는지 확인한다 (ADR-0012)
  desktop:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 웹 빌드가 Kotlin 세션 빌드 결과를 번들에 담는다
      - uses: ./.github/actions/build-web-session

      # Tauri가 Linux에서 쓰는 웹뷰(WebKitGTK)와 빌드 도구
      - name: 시스템 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/Web/package-lock.json

      # 릴리스 빌드는 웹 빌드 결과(dist)를 앱에 담으므로 먼저 만든다
      - name: 웹 빌드
        working-directory: Apps/Web
        run: |
          npm ci
          npx vite build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Apps/Web/src-tauri

      # custom-protocol: 개발 서버가 아니라 dist를 담는 릴리스 경로까지 컴파일한다
      - name: 컴파일 검사 (릴리스 경로)
        working-directory: Apps/Web/src-tauri
        run: cargo check --locked --features tauri/custom-protocol

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 문서 거버넌스 및 링크 무결성 검사
        run: bash Scripts/check-docs.sh

      - name: 멀티 플랫폼 정책 합격 기준 감사
        run: bash Scripts/check-policy-acceptance.sh

      - name: API 명세-코드 계약 드리프트 감사
        run: bash Scripts/check-api-contract.sh

      - name: 전 플랫폼 TDD 테스트 불변성 감사
        run: bash Scripts/verify-tdd-integrity.sh

  # 플랫폼 간 암호 테스트 벡터: 백엔드 결과와 상관없이 항상 돌도록 따로 둔다
  crypto-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 생성기 재계산 (WebCrypto)
        run: node Tools/crypto-vectors/vectors.mjs --check

      - name: Python 교차 검증
        run: python3 Tools/crypto-vectors/crosscheck.py

      - name: JDK 교차 검증 (AES-GCM 포함)
        run: java Tools/crypto-vectors/CrossCheck.java

  # 디자인 토큰: tokens.json과 생성된 웹·Apple 파일이 같은지 검사한다 (ADR-0026)
  design-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 생성 파일 검사
        run: node Tools/design-tokens/generate.mjs --check

      - name: 컴포넌트 계약 검사 (design-system.md 6.1절 ↔ 웹·Apple 구현)
        run: node Tools/design-tokens/check-components.mjs

  # Apple 클라이언트(iOS·macOS): 정적 린트·정책 합격 기준·Tuist 생성·Swift 6 빌드·단위 테스트 (ADR-0014, ADR-0015)
  apple:
    needs: changes
    if: ${{ needs.changes.outputs.apple == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install_args: "tuist@4.191.5"

      - name: Tuist 전역 버전 활성화
        run: mise use -g tuist@4.191.5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # 공유 Kotlin 묶음 프레임워크를 만들 때 carti-RIBs-KMP를 composite build로 가져온다. 버전 고정은 android 작업과 같다
      # RIBsKMPSwiftUI(Swift 패키지)도 같은 폴더에서 가져오므로 Tuist가 찾는 형제 위치(저장소 바깥)에도 링크를 둔다
      - uses: actions/checkout@v4
        with:
          repository: carti1108/carti-RIBs-KMP
          ref: b2b652c790c9d9d70be8baed293b1c2b3bc175f8
          path: carti-RIBs-KMP

      - name: carti-RIBs-KMP를 형제 폴더 위치에 연결
        run: ln -sfn "${{ github.workspace }}/carti-RIBs-KMP" "${{ github.workspace }}/../carti-RIBs-KMP"

      - name: Tuist 외부 의존성 캐시
        uses: actions/cache@v4
        with:
          path: |
            Apps/Apple/Tuist/.build
            ~/.cache/tuist
          key: tuist-${{ runner.os }}-${{ hashFiles('Apps/Apple/Tuist/Package.resolved', 'Apps/Apple/Tuist/Package.swift') }}

      - name: Apple 6중 기계적 통합 검증
        env:
          CARTI_RIBS_DIR: ${{ github.workspace }}/carti-RIBs-KMP
        run: bash Scripts/verify-apple.sh
