# 검증 위임 체계의 기계 판정 단계 (ADR-0009)
# PR과 main 푸시마다 백엔드(빌드·테스트·격리 검사·뮤테이션), 웹 클라이언트(타입·lint·테스트·빌드),
# 플랫폼 간 암호 테스트 벡터, 문서 검사를 돌린다
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR 브랜치에 새로 푸시하면 이전 실행은 취소한다. main 커밋은 하나하나 결과를 남기도록 취소하지 않는다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Gradle을 한 번만 띄우도록 검증과 뮤테이션 테스트를 한 호출로 돌린다
      - name: 빌드·테스트·격리 검사·뮤테이션 테스트
        run: ./gradlew check :domain:pitest --console=plain

      - name: 뮤테이션 점수 요약
        if: always()
        run: |
          if [ -f domain/build/reports/pitest/mutations.xml ]; then
            python3 ../Scripts/mutation-score.py domain/build/reports/pitest/mutations.xml >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            Back/*/build/reports/tests
            Back/domain/build/reports/pitest
          if-no-files-found: ignore

  # 웹·데스크톱 클라이언트 (ADR-0010, ADR-0012)
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/Web/package-lock.json

      - run: npm ci

      - name: 타입 검사·lint(계층 격리 포함)·테스트
        run: npm run check

      # 타입 검사는 위 check에서 했으므로 번들만 만든다
      - name: 빌드
        run: npx vite build

  # 웹 클라이언트 코드를 실제 백엔드에 붙여 가입·동기화·충돌 병합·잠금 흐름을 확인한다
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/Web/package-lock.json

      - name: 백엔드 실행
        working-directory: Back
        run: |
          ./gradlew :app:bootJar --console=plain
          # -plain.jar은 의존성이 없는 jar라 실행 가능한 jar만 고른다
          java -jar "$(ls app/build/libs/*.jar | grep -v plain)" > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: 백엔드 준비 대기
        run: |
          for i in $(seq 1 60); do
            # 시작하다 죽었으면 2분을 다 기다리지 않고 바로 실패한다
            kill -0 "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || exit 1
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"email":"probe@example.com"}' http://localhost:8080/api/v1/auth/prelogin || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          exit 1

      - name: 통합 테스트
        working-directory: Apps/Web
        run: |
          npm ci
          npm run test:integration

      - name: 실패 시 백엔드 로그
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  # 데스크톱 틀(Tauri v2)이 컴파일되는지 확인한다 (ADR-0012)
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri가 Linux에서 쓰는 웹뷰(WebKitGTK)와 빌드 도구
      - name: 시스템 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Apps/Web/package-lock.json

      # 릴리스 빌드는 웹 빌드 결과(dist)를 앱에 담으므로 먼저 만든다
      - name: 웹 빌드
        working-directory: Apps/Web
        run: |
          npm ci
          npx vite build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Apps/Web/src-tauri

      # custom-protocol: 개발 서버가 아니라 dist를 담는 릴리스 경로까지 컴파일한다
      - name: 컴파일 검사 (릴리스 경로)
        working-directory: Apps/Web/src-tauri
        run: cargo check --locked --features tauri/custom-protocol

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 문서 거버넌스 및 링크 무결성 검사
        run: bash Scripts/check-docs.sh

      - name: 멀티 플랫폼 정책 합격 기준 감사
        run: bash Scripts/check-policy-acceptance.sh

      - name: API 명세-코드 계약 드리프트 감사
        run: bash Scripts/check-api-contract.sh

      - name: 전 플랫폼 TDD 테스트 불변성 감사
        run: bash Scripts/verify-tdd-integrity.sh

  # 플랫폼 간 암호 테스트 벡터: 백엔드 결과와 상관없이 항상 돌도록 따로 둔다
  crypto-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 생성기 재계산 (WebCrypto)
        run: node Tools/crypto-vectors/vectors.mjs --check

      - name: Python 교차 검증
        run: python3 Tools/crypto-vectors/crosscheck.py

      - name: JDK 교차 검증 (AES-GCM 포함)
        run: java Tools/crypto-vectors/CrossCheck.java

  # Apple 클라이언트(iOS·macOS): 정적 린트·정책 합격 기준·Tuist 생성·Swift 6 빌드·단위 테스트 (ADR-0014, ADR-0015)
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install_args: "tuist@4.191.5"

      - name: Tuist 전역 버전 활성화
        run: mise use -g tuist@4.191.5

      - name: Tuist 외부 의존성 캐시
        uses: actions/cache@v4
        with:
          path: |
            Apps/Apple/Tuist/.build
            ~/.cache/tuist
          key: tuist-${{ runner.os }}-${{ hashFiles('Apps/Apple/Tuist/Package.resolved', 'Apps/Apple/Tuist/Package.swift') }}

      - name: Apple 6중 기계적 통합 검증
        run: bash Scripts/verify-apple.sh
