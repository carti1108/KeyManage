ribs-coroutines = { module = "com.uber.rib:rib-coroutines", version.ref = "ribs" }
ribs-test = { module = "com.uber.rib:rib-test", version.ref = "ribs" }
ribs-coroutines-test = { module = "com.uber.rib:rib-coroutines-test", version.ref = "ribs" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
org-json = { module = "org.json:json", version.ref = "org-json" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
# build-logic 전용
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
km-jvm-library = { id = "km.jvm.library" }
km-android-library = { id = "km.android.library" }
km-android-compose = { id = "km.android.compose" }
km-android-application = { id = "km.android.application" }
