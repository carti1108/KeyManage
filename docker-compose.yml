# 로컬 데모 실행 구성 (ADR-0021). 사용법은 README.md의 "사용법"을 본다
name: keymanage

services:
  backend:
    build:
      context: .
      dockerfile: Docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      # 인증 요청 제한이 실제 클라이언트 IP를 쓰도록 caddy만 신뢰 프록시로 둔다 (SEC-002)
      KEYMANAGE_HTTP_TRUSTED_PROXIES: 172.29.83.10
      # 데스크톱 앱(Windows)과 TLS를 끝내는 프록시 뒤의 같은 출처 웹 (ADR-0013)
      KEYMANAGE_HTTP_ALLOWED_ORIGINS: http://tauri.localhost,https://localhost:8443
      # 내 계정을 만든 뒤 false로 띄우면 새 가입을 막는다 (SEC-002)
      KEYMANAGE_AUTH_REGISTRATION_ENABLED: ${KEYMANAGE_REGISTRATION_ENABLED:-true}
    volumes:
      - keymanage-data:/data
    networks:
      - keymanage
    # 백엔드 포트는 호스트에 열지 않는다. caddy만 접속한다

  caddy:
    build:
      context: .
      dockerfile: Docker/caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 루프백에만 연다. 같은 네트워크의 다른 기기는 접속할 수 없다
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      # mkcert로 만든 localhost.pem, localhost-key.pem. 없으면 8080만 뜬다
      - ./certs:/certs:ro
    networks:
      keymanage:
        ipv4_address: 172.29.83.10

networks:
  keymanage:
    ipam:
      config:
        - subnet: 172.29.83.0/24
          # 자동 배정은 위쪽 절반에서만 한다. caddy의 고정 IP(.10)와 겹치지 않는다
          ip_range: 172.29.83.128/25

volumes:
  keymanage-data:
